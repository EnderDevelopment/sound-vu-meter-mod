plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.79.0+1.20.4'
}

processResources {
    inputs.property 'version', project.version
    from 'src/main/resources'
    include 'fabric.mod.json'
    into 'META-INF/mods'
}

loom {
    accessWidenerPath = file('src/main/resources/accessWidener.txt').getAbsolutePath()
    refreshVersions = true
    refreshDeps = true
}
